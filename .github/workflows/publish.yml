# Publica no npm a cada tag vX.Y.Z, com atestação de proveniência. A tag precisa
# bater com a versão do package.json e do src/version.ts.
# Configuração única no npmjs.com: pacote fiscalapi-br → Settings →
# Trusted Publishers → GitHub Actions: owner "fiscaIapi", repo
# "fiscalapi-node", workflow "publish.yml". (Alternativa: secret NPM_TOKEN.)
# Na primeira publicação o pacote ainda não existe no npm: use o NPM_TOKEN
# uma vez e depois cadastre o Trusted Publisher.
name: Publish

on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC para proveniência / trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
      - name: Confere a tag com a versão do pacote
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          src=$(sed -n "s/.*VERSION = '\(.*\)'.*/\1/p" src/version.ts)
          echo "tag=$tag package.json=$pkg version.ts=$src"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$src" ]
      - name: Atualiza o npm (trusted publishing exige npm 11.5 ou superior)
        run: npm install -g npm@latest
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Publica
        run: |
          [ -n "$NODE_AUTH_TOKEN" ] || unset NODE_AUTH_TOKEN
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
